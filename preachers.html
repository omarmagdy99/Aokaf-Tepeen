<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الخطباء - خطباء التبين</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

        rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 12px 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .navbar-brand i {
            color: #f59e0b;
        }

        .nav-link-custom {
            color: #cbd5e1 !important;
            font-weight: 500;
            padding: 8px 20px !important;
            border-radius: 12px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            color: #f59e0b !important;
            background: rgba(245, 158, 11, 0.15);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 8px 20px;
            border-radius: 12px;
            color: #fca5a5;
            font-weight: 500;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            transform: translateY(-2px);
        }

        .content-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .table-custom {
            margin-bottom: 0;
        }

        .table-custom th {
            background: #f8fafc;
            font-weight: 700;
            color: #1e293b;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .search-box {
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            padding: 10px 20px;
            width: 100%;
            font-family: 'Tajawal', sans-serif;
        }

        .search-box:focus {
            border-color: #f59e0b;
            outline: none;
        }

        .hidden-id {
            font-family: monospace;
            letter-spacing: 2px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-custom {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-note {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }

        .modal-preacher-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-preacher-item:hover {
            background-color: #f8fafc;
        }

        @media (max-width: 768px) {
            .table-container {
                max-height: 400px;
            }

            .btn-sm {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

    <!-- ===== شريط التنقل ===== -->
    <div id="navbar-placeholder"></div>

    <script>
        // تحميل شريط التنقل
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            })
            .catch(error => {
                console.error('خطأ في تحميل شريط التنقل:', error);
                // في حال عدم التحميل، نعرض نسخة احتياطية
                document.getElementById('navbar-placeholder').innerHTML = `
                <nav class="navbar navbar-custom navbar-expand-lg">
                    <div class="container">
                        <a class="navbar-brand" href="dashboard.html"><i class="fas fa-chalkboard-user"></i> خطباء التبين</a>
                        <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav ms-auto me-3">
                                <li class="nav-item"><a class="nav-link-custom" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> الرئيسية</a></li>
                                <li class="nav-item"><a class="nav-link-custom" href="mosques.html"><i class="fas fa-mosque"></i> المساجد</a></li>
                                <li class="nav-item"><a class="nav-link-custom" href="preachers.html"><i class="fas fa-users"></i> الخطباء</a></li>
                                <li class="nav-item"><a class="nav-link-custom" href="admins.html"><i class="fas fa-users-cog"></i> المشرفين</a></li>
                            </ul>
                            <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
                        </div>
                    </div>
                </nav>
                <style>${getNavbarStyles()}</style>
            `;
            });

        function getNavbarStyles() {
            return `
            .navbar-custom { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 12px 0; position: sticky; top: 0; z-index: 1000; }
            .navbar-brand { font-weight: 800; font-size: 1.4rem; background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
            .navbar-brand i { color: #f59e0b; }
            .custom-toggler { border: 1px solid rgba(245, 158, 11, 0.5); background: transparent; padding: 8px 12px; border-radius: 8px; }
            .custom-toggler .navbar-toggler-icon { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(245, 158, 11, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e"); }
            .nav-link-custom { color: #cbd5e1 !important; font-weight: 500; padding: 8px 20px !important; border-radius: 12px; transition: all 0.3s; text-decoration: none; }
            .nav-link-custom:hover { color: #f59e0b !important; background: rgba(245, 158, 11, 0.1); }
            .nav-link-custom.active { color: #f59e0b !important; background: rgba(245, 158, 11, 0.15); }
            .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); padding: 8px 20px; border-radius: 12px; color: #fca5a5; font-weight: 500; transition: all 0.3s; cursor: pointer; }
            .btn-logout:hover { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; transform: translateY(-2px); }
            @media (max-width: 768px) { .navbar-brand { font-size: 1.1rem; } .nav-link-custom { padding: 10px 15px !important; text-align: center; } .btn-logout { margin: 10px 15px; width: calc(100% - 30px); text-align: center; } }
        `;
        }
    </script>
    <div class="container">
        <div id="mainContent"></div>
    </div>

    <div class="footer-note">
        <i class="fas fa-mosque"></i> نظام إدارة خطباء التبين - إدارة الخطباء
    </div>

    <!-- مودال إضافة خطيب -->
    <div class="modal fade" id="addPreacherModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> إضافة خطيب جديد</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="addAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">اسم الخطيب</label>
                        <input type="text" id="newPreacherName" class="form-control" placeholder="مثال: أحمد محمد حسن">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الرقم السري</label>
                        <input type="text" id="newPreacherNationalId" class="form-control" placeholder="رقم سري فريد">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="submitAddPreacher()">إضافة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال تعديل الرقم السري -->
    <div class="modal fade" id="editIdModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-key"></i> تعديل الرقم السري</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="editAlert"></div>
                    <div class="mb-3">
                        <label class="form-label">الخطيب</label>
                        <input type="text" id="editPreacherName" class="form-control" readonly disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الرقم السري الجديد</label>
                        <input type="text" id="editNewNationalId" class="form-control"
                            placeholder="أدخل الرقم السري الجديد">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-warning" onclick="submitEditId()">تحديث</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========================================
        // التكوينات
        // ========================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxGfd9nD_Iiy4Mhv-Sxy9kSzBCQFpr40FVtnmap5aESTqJsZZcDjo5wLNNfOZ5TX9Y2Gg/exec';

        let allPreachers = [];
        let currentSearchTerm = '';
        let editingPreacher = null;
        let isLoading = false;

        // ========================================
        // التحقق من تسجيل الدخول
        // ========================================
        function checkAuth() {
            if (localStorage.getItem('adminLoggedIn') !== 'true') {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // ========================================
        // جلب جميع الخطباء
        // ========================================
        async function fetchAllPreachers() {
            showLoading(true);
            try {
                const url = `${API_URL}?action=getAllPreachers`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.success) {
                    allPreachers = result.data.preachers || [];
                    return true;
                }
                return false;
            } catch (error) {
                console.error(error);
                return false;
            } finally {
                showLoading(false);
            }
        }

        // ========================================
        // البحث في الخطباء
        // ========================================
        async function searchPreachers(searchTerm) {
            showLoading(true);
            try {
                const url = `${API_URL}?action=searchPreachers&searchTerm=${encodeURIComponent(searchTerm)}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.success) {
                    allPreachers = result.data.preachers || [];
                    return true;
                }
                return false;
            } catch (error) {
                console.error(error);
                return false;
            } finally {
                showLoading(false);
            }
        }

        // ========================================
        // إضافة خطيب
        // ========================================
        async function addPreacher(name, nationalId) {
            try {
                const url = `${API_URL}?action=addPreacher&name=${encodeURIComponent(name)}&nationalId=${encodeURIComponent(nationalId)}&adminName=${encodeURIComponent(localStorage.getItem('adminUsername') || 'المشرف')}`;
                const response = await fetch(url);
                const result = await response.json();
                return result;
            } catch (error) {
                return { success: false, message: error.message };
            }
        }

        // ========================================
        // تحديث الرقم السري
        // ========================================
        async function updateNationalId(rowIndex, newNationalId) {
            try {
                const url = `${API_URL}?action=updatePreacherNationalId&rowIndex=${rowIndex}&newNationalId=${encodeURIComponent(newNationalId)}&adminName=${encodeURIComponent(localStorage.getItem('adminUsername') || 'المشرف')}`;
                const response = await fetch(url);
                const result = await response.json();
                return result;
            } catch (error) {
                return { success: false, message: error.message };
            }
        }

        // ========================================
        // حذف خطيب
        // ========================================
        async function deletePreacher(rowIndex, name) {
            if (!confirm(`⚠️ هل أنت متأكد من حذف الخطيب "${name}"؟\n\nسيتم حذف جميع بياناته من النظام.\nهذا الإجراء لا يمكن التراجع عنه.`)) {
                return false;
            }

            showLoading(true);
            try {
                const url = `${API_URL}?action=deletePreacher&rowIndex=${rowIndex}&adminName=${encodeURIComponent(localStorage.getItem('adminUsername') || 'المشرف')}`;
                const response = await fetch(url);
                const result = await response.json();
                return result;
            } catch (error) {
                return { success: false, message: error.message };
            } finally {
                showLoading(false);
            }
        }

        // ========================================
        // تحديث الجدول
        // ========================================
        async function refreshData() {
            if (currentSearchTerm) {
                await searchPreachers(currentSearchTerm);
            } else {
                await fetchAllPreachers();
            }
            renderTable();
        }

        // ========================================
        // عرض الجدول
        // ========================================
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            if (!tableBody) return;

            if (allPreachers.length === 0) {
                tableBody.innerHTML = `<td><td colspan="5" class="text-center text-muted py-5">لا يوجد خطباء${currentSearchTerm ? ' مطابقين للبحث' : ''}</td></td>`;
                return;
            }

            let tableRows = '';
            allPreachers.forEach((preacher, idx) => {
                // حساب حالة الخطيب (مؤكد/معتذر/مستعد في أي خطبة)
                let statusBadge = '';
                const statuses = [preacher.statuses[1], preacher.statuses[2], preacher.statuses[3], preacher.statuses[4]];
                if (statuses.some(s => s === 'تأكيد الحضور')) statusBadge = '<span class="badge bg-success">مؤكد في خطبة</span>';
                else if (statuses.some(s => s === 'معتذر')) statusBadge = '<span class="badge bg-danger">معتذر</span>';
                else if (statuses.some(s => s === 'مستعد للخطبة')) statusBadge = '<span class="badge bg-info text-dark">مستعد للخطبة</span>';
                else statusBadge = '<span class="badge bg-secondary">لم يحدد</span>';

                tableRows += `
                    <tr>
                        <td class="text-center">${idx + 1}</td>
                        <td><strong>${escapeHtml(preacher.name)}</strong></td>
                        <td class="hidden-id" id="id-${preacher.rowIndex}">
                            <span id="id-text-${preacher.rowIndex}">${'●'.repeat(preacher.nationalId.length)}</span>
                            <i class="fas fa-eye" style="cursor:pointer; margin-right:8px;" onclick="toggleShowId(${preacher.rowIndex}, '${escapeHtml(preacher.nationalId)}')" title="إظهار الرقم"></i>
                        </td>
                        <td>${statusBadge}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-warning me-1" onclick="openEditIdModal(${preacher.rowIndex}, '${escapeHtml(preacher.name)}')" title="تعديل الرقم السري">
                                <i class="fas fa-key"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deletePreacherConfirm(${preacher.rowIndex}, '${escapeHtml(preacher.name)}')" title="حذف خطيب">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = tableRows;

            // تحديث عدد النتائج
            const resultCount = document.getElementById('resultCount');
            if (resultCount) resultCount.textContent = allPreachers.length;
        }

        // إظهار/إخفاء الرقم السري
        window.toggleShowId = function (rowIndex, nationalId) {
            const span = document.getElementById(`id-text-${rowIndex}`);
            if (span.textContent === '●'.repeat(nationalId.length)) {
                span.textContent = nationalId;
            } else {
                span.textContent = '●'.repeat(nationalId.length);
            }
        };

        // ========================================
        // فتح مودال إضافة خطيب
        // ========================================
        window.openAddPreacherModal = function () {
            document.getElementById('newPreacherName').value = '';
            document.getElementById('newPreacherNationalId').value = '';
            document.getElementById('addAlert').innerHTML = '';
            const modal = new bootstrap.Modal(document.getElementById('addPreacherModal'));
            modal.show();
        };

        // ========================================
        // إضافة خطيب
        // ========================================
        window.submitAddPreacher = async function () {
            const name = document.getElementById('newPreacherName').value.trim();
            const nationalId = document.getElementById('newPreacherNationalId').value.trim();

            if (!name || !nationalId) {
                document.getElementById('addAlert').innerHTML = '<div class="alert alert-danger">يرجى إدخال الاسم والرقم السري</div>';
                return;
            }

            const result = await addPreacher(name, nationalId);
            if (result.success) {
                document.getElementById('addAlert').innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                setTimeout(() => {
                    bootstrap.Modal.getInstance(document.getElementById('addPreacherModal')).hide();
                    refreshData();
                }, 1000);
            } else {
                document.getElementById('addAlert').innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
            }
        };

        // ========================================
        // فتح مودال تعديل الرقم السري
        // ========================================
        window.openEditIdModal = function (rowIndex, name) {
            editingPreacher = { rowIndex, name };
            document.getElementById('editPreacherName').value = name;
            document.getElementById('editNewNationalId').value = '';
            document.getElementById('editAlert').innerHTML = '';
            const modal = new bootstrap.Modal(document.getElementById('editIdModal'));
            modal.show();
        };

        // ========================================
        // تعديل الرقم السري
        // ========================================
        window.submitEditId = async function () {
            const newNationalId = document.getElementById('editNewNationalId').value.trim();

            if (!newNationalId) {
                document.getElementById('editAlert').innerHTML = '<div class="alert alert-danger">يرجى إدخال الرقم السري الجديد</div>';
                return;
            }

            const result = await updateNationalId(editingPreacher.rowIndex, newNationalId);
            if (result.success) {
                document.getElementById('editAlert').innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                setTimeout(() => {
                    bootstrap.Modal.getInstance(document.getElementById('editIdModal')).hide();
                    refreshData();
                }, 1000);
            } else {
                document.getElementById('editAlert').innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
            }
        };

        // ========================================
        // حذف خطيب
        // ========================================
        window.deletePreacherConfirm = async function (rowIndex, name) {
            const result = await deletePreacher(rowIndex, name);
            if (result && result.success) {
                showToast(`✅ ${result.message}`, false);
                refreshData();
            } else if (result && !result.success) {
                showToast(`❌ ${result.message}`, true);
            }
        };

        // ========================================
        // البحث
        // ========================================
        window.searchPreachersList = async function () {
            const searchTerm = document.getElementById('searchInput').value.trim();
            currentSearchTerm = searchTerm;

            showLoading(true);
            if (searchTerm) {
                await searchPreachers(searchTerm);
            } else {
                await fetchAllPreachers();
            }
            showLoading(false);
            renderTable();
        };

        // ========================================
        // تحميل الواجهة الرئيسية
        // ========================================
        async function loadPage() {
            await fetchAllPreachers();

            document.getElementById('mainContent').innerHTML = `
                <div class="content-card">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                        <h4 class="mb-0"><i class="fas fa-users"></i> إدارة الخطباء</h4>
                        <button class="btn btn-primary" onclick="openAddPreacherModal()">
                            <i class="fas fa-user-plus"></i> إضافة خطيب جديد
                        </button>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="input-group">
                                <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث بالاسم أو الرقم السري..." onkeyup="if(event.key==='Enter') searchPreachersList()">
                                <button class="btn btn-outline-primary" onclick="searchPreachersList()">بحث</button>
                                <button class="btn btn-outline-secondary" onclick="document.getElementById('searchInput').value=''; currentSearchTerm=''; refreshData();">مسح</button>
                            </div>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <span class="text-muted">عدد النتائج: <span id="resultCount">${allPreachers.length}</span></span>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <table class="table table-bordered table-custom">
                            <thead>
                                <tr><th width="50">#</th><th>اسم الخطيب</th><th>الرقم السري</th><th width="120">الحالة العامة</th><th width="150">الإجراءات</th></tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            `;

            renderTable();
        }

        function showToast(message, isError) {
            const toast = document.createElement('div');
            toast.className = 'toast-custom';
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
            toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:50px;z-index:10000;';
            if (isError) toast.style.background = '#dc2626';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showLoading(show) {
            if (show && !isLoading) {
                isLoading = true;
                const overlay = document.createElement('div');
                overlay.id = 'loadingOverlay';
                overlay.className = 'loading-overlay';
                overlay.innerHTML = '<div class="spinner-custom"></div>';
                document.body.appendChild(overlay);
            } else if (!show && isLoading) {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) overlay.remove();
                isLoading = false;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAuth()) return;
            loadPage();
            document.getElementById('logoutBtn').addEventListener('click', logout);
        });
    </script>
</body>

</html>
